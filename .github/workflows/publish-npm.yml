{
  "name": "Publish npm",
  "on": {
    "release": {
      "types": ["published"]
    },
    "workflow_dispatch": {
      "inputs": {
        "tag": {
          "description": "Existing release tag to publish, for example v2.11.0",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "id-token": "write"
  },
  "concurrency": {
    "group": "publish-npm-${{ github.event.release.tag_name || inputs.tag }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "name": "Verify and publish",
      "if": "github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "env": {
        "NPM_CONFIG_REGISTRY": "https://registry.npmjs.org",
        "RELEASE_TAG": "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
      },
      "steps": [
        {
          "name": "Checkout release tag",
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false,
            "ref": "${{ env.RELEASE_TAG }}"
          }
        },
        {
          "name": "Set up Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.x",
            "registry-url": "https://registry.npmjs.org"
          }
        },
        {
          "name": "Use trusted-publishing capable npm",
          "run": "npm install --global npm@11.18.0 --ignore-scripts"
        },
        {
          "name": "Verify release tag and package version",
          "shell": "bash",
          "run": "set -euo pipefail\ncase \"$RELEASE_TAG\" in\n  v[0-9]*) ;;\n  *) echo \"Invalid release tag\" >&2; exit 1 ;;\nesac\nversion=\"${RELEASE_TAG#v}\"\npackage_version=\"$(node -p \"require('./package.json').version\")\"\ntest \"$package_version\" = \"$version\"\nif npm view \"ai-workbench-dashboard@$version\" version --silent >/dev/null 2>&1; then\n  echo \"Version already exists on npm\" >&2\n  exit 1\nfi"
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Run isolated tests and build",
          "run": "npm run test:ci:pure"
        },
        {
          "name": "Verify npm package",
          "run": "npm run test:npm-package"
        },
        {
          "name": "Audit official registry",
          "run": "npm audit --registry=https://registry.npmjs.org"
        },
        {
          "name": "Publish latest with npm trusted publishing",
          "run": "npm publish --access public --tag latest"
        },
        {
          "name": "Verify published version",
          "shell": "bash",
          "run": "set -euo pipefail\nversion=\"${RELEASE_TAG#v}\"\nfor attempt in 1 2 3 4 5 6; do\n  published=\"$(npm view ai-workbench-dashboard@latest version --silent || true)\"\n  if test \"$published\" = \"$version\"; then\n    exit 0\n  fi\n  sleep 10\ndone\necho \"npm latest did not converge to the release version\" >&2\nexit 1"
        }
      ]
    }
  }
}
